[project]
name = "railrailrail"
version = "0.0.1"
description = "Route planner for the Singapore MRT/LRT rail network."
authors = [{ name = "Wu Tingfeng", email = "wutingfeng@outlook.com" }]
requires-python = ">=3.15,<3.16"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "dijkstar==2.6.0",
    "geopandas==1.2.0",
    "immutabledict==4.3.1",
    "ipykernel==7.4.0",
    "nbformat==5.11.1",
    "plotly==7.1.0",
    "psutil==7.2.2",
    "requests==2.34.2",
    "statsmodels==0.15.0",
    "tomlkit==0.15.3",
    "xlrd==2.0.2",
    "jupyter==1.1.1",
]

[tool.pyrefly]
project-includes = ["**/*.py*"]

[dependency-groups]
dev = [
    "ruff==0.17.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
    "pytest-xdist==3.8.0",
    "pre-commit==4.7.0",
    "pyrefly==1.3.2",
    "types-shapely==2.1.0.20260728",
]

[build-system]
requires = ["flit-core >=4.0.2, <5"]
build-backend = "flit_core.buildapi"

[tool.ruff.lint]
select = [
    "YTT",   # flake8-2020
    "S",     # flake8-bandit
    "B",     # flake8-bugbear
    "COM",   # flake8-commas
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "PTH",   # flake8-use-pathlib
    "I",     # isort
    "PERF",  # Perflint
    "E",     # pycodestyle
    "W",     # pycodestyle
    "F",     # Pyflakes
    "UP",    # pyupgrade
    "RUF",   # Ruff-specific rules
]
ignore = [
    "COM812",   # missing trailing comma; conflicts with ruff format
    "E501",     # line too long; the formatter handles line length
    "S603",     # subprocess call with shell=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert statement used; pytest relies on assert statements
]
"!tests/**" = [
    "PT", # pytest style rules are to be ignored outside of tests
]

[tool.uv]
audit = { malware-check = true }
exclude-newer = "42 days"
preview-features = ["malware-check"]
