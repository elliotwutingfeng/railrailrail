[project]
name = "railrailrail"
version = "0.0.1"
description = "Route planner for the Singapore MRT/LRT rail network."
authors = [{ name = "Wu Tingfeng", email = "wutingfeng@outlook.com" }]
requires-python = ">=3.15,<3.16"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "dijkstar==2.6.0",
    "geopandas==1.2.0",
    "immutabledict==4.3.1",
    "ipykernel==7.4.0",
    "nbformat==5.11.1",
    "plotly==7.1.0",
    "psutil==7.2.2",
    "requests==2.34.2",
    "statsmodels==0.15.0",
    "tomlkit==0.15.2",
    "xlrd==2.0.2",
    "jupyter==1.1.1",
]

[tool.pyrefly]
project-includes = ["**/*.py*"]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "pytest-xdist==3.8.0",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["uv_build >=0.13, <0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
